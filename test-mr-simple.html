<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MR Split Test — GLB public</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@1.12.0/dist/model-viewer.min.js"></script>
<style>
  body{margin:0;background:#071029;color:#fff;font-family:system-ui}
  #row{display:flex;height:100vh}
  model-viewer{width:50%;height:100%;background:#000;border:0}
</style>
</head>
<body>
  <div id="row">
    <model-viewer id="left" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
    <model-viewer id="right" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
  </div>

<script>
  let last = 0;
  const left = document.getElementById('left');
  const right = document.getElementById('right');

  left.addEventListener('camera-change', () => {
    const now = Date.now();
    if (now - last < 30) return;
    last = now;
    const orbit = left.getAttribute('camera-orbit');
    if (orbit) right.setAttribute('camera-orbit', orbit);
  });
</script>
</body>
</html>
